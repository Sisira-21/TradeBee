<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Notification </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
{% extends 'Adminpages/aindex.html' %}
{% block body %}
  <div class="container mt-5">
    <h4 class="mb-4">Edit Notification</h4>
    <form method="post" action="/myapp/adminedit_noti_post/">
      
    {% csrf_token %}
      <!-- Complaint Text -->
      <div class="mb-3">
          <input name="id" value="{{ data.id }}" type="hidden">
        <label for="photo" class="form-label">Notification </label>
        <input type="text" class="form-control" name="notification" value="{{ data.notification }}">
      </div>



      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary">Edit</button>
    </form>
  </div>
{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
