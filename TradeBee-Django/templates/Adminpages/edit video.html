<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Videos </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
{% extends 'Adminpages/aindex.html' %}
{% block body %}
  <div class="container mt-5">
    <h4 class="mb-4">Edit Videos</h4>
    <form method="post" action="/myapp/adminedit_video_post/" enctype="multipart/form-data">

     {% csrf_token %}
      <!-- Complaint Text -->
      <div class="mb-3">
          <input name="id" value="{{ data.id }}" type="hidden">
        <label for="photo" class="form-label">Title </label>
        <input type="text" class="form-control" name="title" {{ data.title }}>
      </div>

      <!-- Optional File Upload -->
      <div class="mb-3">
        <label for="photo" class="form-label">Video </label>
          <video width="100" height="60" controls>
    <source src="{{ data.video }}" type="video/mp4">
    Your browser does not support the video tag.</video>
        <input type="file" class="form-control" name="video" {{ data.video }}>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary">Edit</button>
    </form>
{#    {% for i in messages %}#}
{#      {{ i }}#}
{#    {% endfor %}#}
  </div>
{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
