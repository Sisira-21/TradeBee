<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Notification </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
{% extends 'Adminpages/aindex.html' %}
{% block body %}
  <div class="container mt-5">
    <h4 class="mb-4">Add Notification</h4>
    <form method="post" action="/myapp/asend_notification_post/">
        {% csrf_token %}
      

      <!-- Complaint Text -->
      <div class="mb-3">
        <label for="photo" class="form-label">Notification </label>
        <input name="notification" type="text" class="form-control" id="photo">
      </div>



      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary">Add</button>
    </form>
  </div>
{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
