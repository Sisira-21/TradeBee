<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Send Reply</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
{% extends 'Adminpages/aindex.html' %}
{% block body %}
  <div class="container mt-5">
    <h4 class="mb-4">Send Reply</h4>
    <form method="post" action="/myapp/reply_post/">
        {% csrf_token %}
        <input name="id" type="hidden" value="{{ id }}">

      <!-- Reply Text -->
      <div class="mb-3">
        <label for="complaint" class="form-label">Reply</label>
        <textarea name="reply" class="form-control" id="complaint" rows="4" placeholder="Write your complaint here..." required></textarea>
      </div>


      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary">Send Reply</button>
    </form>
  </div>
{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
