<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add News</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
{% extends 'Adminpages/aindex.html' %}
{% block body %}
  <div class="container mt-5">
    <h4 class="mb-4">Add News</h4>
    <form method="post" action="/myapp/adminews_add_post/" enctype="multipart/form-data">
      

     {% csrf_token %}

      <!-- Optional File Upload -->
      <div class="mb-3">
        <label for="photo" class="form-label">Title</label>
        <input name="title" type="text" class="form-control" id="photo" >
      </div>

       <!-- Description Text -->
      <div class="mb-3">
        <label for="complaint" class="form-label">Description</label>
        <textarea name="description" class="form-control" id="complaint" rows="4" placeholder="Write your Description here..." required></textarea>
      </div>


         <!-- Optional File Upload -->
      <div class="mb-3">
        <label for="file" class="form-label">Photo</label>
        <input name="file"  class="form-control" id="file" type="file" >
      </div>






      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </div>
{% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
