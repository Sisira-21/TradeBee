<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Videos </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    {% extends 'Adminpages/aindex.html' %}
    {% block body %}
  <div class="container mt-5">
    <h4 class="mb-4">Add Contents</h4>
    <form method="post" action="/myapp/adminadd_content_post/" enctype="multipart/form-data">
      
    {% csrf_token %}
      <!-- Complaint Text -->
      <div class="mb-3">
        <label for="photo" class="form-label">Title </label>
        <input name="title" type="text" class="form-control" id="photo">
      </div>

      <div class="mb-3">
          <select name="type" class="form-control">
              <option value="video">Video</option>
              <option value="article">Article</option>
          </select>
      </div>
          <!-- Optional File Upload -->
      <div class="mb-3">
        <label for="photo" class="form-label">Video </label>
        <input name="video" type="file" class="form-control" id="photo" >
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary">Add</button>
    </form>
      {% for j in messages %}
      {{ j }}
      {% endfor %}
  </div>
{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
