<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Video</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
  <style>
    .img-thumbnail {
      width: 50px;
      height: 50px;
    }
    .filter-box {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
{% extends 'Adminpages/aindex.html' %}
{% block body %}
  <div class="container mt-5">
    <h2 class="mb-4">View Video</h2>

    <!-- Date Filter Inputs -->
  <form method="post"action="/myapp/search_video/">
    {% csrf_token %}
    <div class="row filter-box">
      <div class="col-md-4">
        <label>From Date:</label>
        <input type="date" id="minDate" name="fdate" class="form-control">
      </div>
      <div class="col-md-4">
        <label>To Date:</label>
        <input type="date" id="maxDate" name="tdate" class="form-control">
      </div>
         <div class="col-md-4">
{#<label> </label>#}
        <input type="submit" class="btn btn-success mt-4">
      </div>
    </div>
    </form>
    <table id="registrationTable" class="table table-striped table-bordered">
      <thead>
        <tr>
          <th>Sl.no</th>
          <th>Date</th>
          <th>Title</th>
          <th>Video</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
      {% for i in data  %}
        <!-- Sample Data Rows -->
        <tr>
          <td width="5%">{{ forloop.counter }}</td>
          <td>{{ i.date }}</td>
          <td>{{ i.title }}</td>
          <td><video width="100" height="60" controls>
    <source src="{{ i.video }}" type="video/mp4">
              Your browser does not support the</video></td>


          <td width="15%">
            <a class="btn btn-sm btn-primary" href="/myapp/adminedit_video_get/{{ i.id }}#a">Edit</a>
            <a class="btn btn-sm btn-danger" href="/myapp/admindelete_video/{{ i.id }}">Delete</a>
          </td>

        </tr>
      {% endfor %}

        <!-- More rows as needed -->
      </tbody>
    </table>
  </div>
{% endblock %}
  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

  <script>
    // Custom filtering function for date range
    $.fn.dataTable.ext.search.push(function (settings, data, dataIndex) {
      let min = $('#minDate').val();
      let max = $('#maxDate').val();
      let dob = data[3]; // Index of DOB column

      if (!min && !max) return true;

      const date = new Date(dob);
      const minDate = min ? new Date(min) : null;
      const maxDate = max ? new Date(max) : null;

      if (
        (!minDate || date >= minDate) &&
        (!maxDate || date <= maxDate)
      ) {
        return true;
      }
      return false;
    });

    $(document).ready(function () {
      const table = $('#registrationTable').DataTable();

      // Event listeners for date range filtering
      $('#minDate, #maxDate').on('change', function () {
        table.draw();
      });
    });
  </script>
</body>
</html>
